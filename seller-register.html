<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register as Seller | DavinciMarket</title>
    <link rel="stylesheet" href="Css/seller.css">
</head>
<body>

<div class="auth-container">
    <a href="index.html" class="brand"><img class="brand-logo" src="img/logo.jpeg" alt="">Davin<span>ciMarket</span></a>

    <div class="auth-card">
        <div class="logo">D</div>
        <p class="eyebrow">JOIN OUR MARKETPLACE</p>
        <h1>Create seller account</h1>
        <p class="subtitle">Register your business on DavinciMarket.</p>

        <form id="sellerRegisterForm">
            <label>Full name</label>
            <input type="text" id="fullName" placeholder="Your full name" required>

            <label>Business name</label>
            <input type="text" id="businessName" placeholder="Your business name" required>

            <label>Email address</label>
            <input type="email" id="email" placeholder="Business email" required>

            <label>Phone number</label>
            <input type="tel" id="phone" placeholder="e.g. 09037141652" required>

            <label>Business location</label>
            <input type="text" id="location" placeholder="Lagos, Nigeria" required>

            <label>Password</label>
            <input type="password" id="password" placeholder="At least 6 characters" minlength="6" required>

            <label>Confirm password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm password" required>

            <button type="submit" id="registerBtn">Create Seller Account</button>
            <p id="message"></p>
        </form>

        <p class="switch">
            Already registered?
            <a href="seller-login.html">Sign in</a>
        </p>

        <a href="index.html" class="back">← Back to marketplace</a>
    </div>
</div>

<script type="module" src="js/seller-auth.js"></script>
</body>
</html>
